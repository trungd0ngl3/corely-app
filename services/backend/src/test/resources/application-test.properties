spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.signer-key=test_signer_key_must_be_at_least_64_characters_long_for_hs512_algorithm_support_in_nimbus_jose_jwt
jwt.valid-duration=3600
jwt.refreshable-duration=360000

cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
app.frontend-url=http://localhost:3000
spring.mail.host=localhost
spring.mail.port=1025

spring.security.oauth2.client.registration.google.client-id=test-google
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.facebook.client-id=test-facebook
spring.security.oauth2.client.registration.facebook.client-secret=test-facebook-secret